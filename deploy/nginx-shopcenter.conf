# Nginx: shopcenter.cloud e sistemaelogistica.shop apontando para o app (porta 3000).
# O certbot adiciona o HTTPS automaticamente depois (ver deploy/setup-vps.sh).
server {
  listen 80;
  listen [::]:80;
  server_name shopcenter.cloud www.shopcenter.cloud sistemaelogistica.shop www.sistemaelogistica.shop;

  client_max_body_size 25m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Arquivos com hash do build: cache longo.
  location /assets/ {
    proxy_pass http://127.0.0.1:3000;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # O service worker nunca pode ficar em cache, senão o app não atualiza.
  location = /sw.js {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "no-cache";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
